name: publish

# Serpstat fork: on a version tag run the whole suite, then publish the two driver
# modules to GitHub Packages and, when the Central credentials are configured, to
# Maven Central through the Sonatype Central Portal.
on:
  push:
    tags:
      - "v*-serpstat.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # secrets are not readable in step conditions, so the switch lives in env
      HAS_CENTRAL: ${{ secrets.CENTRAL_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17 (GitHub Packages server id "github")
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Tests first, deploy last: a red test must never leave a published artifact behind.
      - name: Unit and integration tests against the ClickHouse version we run
        run: >
          mvn -B -pl clickhouse-native-jdbc,clickhouse-native-jdbc-shaded -am verify
          -DCLICKHOUSE_IMAGE=yandex/clickhouse-server:21.1.9.41
      - name: Deploy to GitHub Packages
        run: >
          mvn -B -pl clickhouse-native-jdbc,clickhouse-native-jdbc-shaded -am
          -DskipTests -Dgpg.skip
          deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Maven Central. Requires repository secrets CENTRAL_USERNAME / CENTRAL_TOKEN
      # (portal user token), GPG_PRIVATE_KEY (armored) and GPG_PASSPHRASE.
      - name: Set up JDK 17 for Central (server id "central", GPG key)
        if: env.HAS_CENTRAL == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Deploy to Maven Central
        if: env.HAS_CENTRAL == 'true'
        run: >
          mvn -B -pl clickhouse-native-jdbc,clickhouse-native-jdbc-shaded -am
          -DskipTests -Prelease,central
          deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_TOKEN: ${{ secrets.CENTRAL_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
