name: build

# Serpstat fork: the upstream matrix (Java 8/11, Scala, Spark) is replaced by
# the single configuration we ship: Java 17 building the two driver modules.
on:
  push:
    branches:
      - "serpstat/*"
  pull_request:
    branches:
      - "serpstat/*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Build with unit tests
        run: mvn -B -pl clickhouse-native-jdbc,clickhouse-native-jdbc-shaded -am -DskipITs package
      - name: Integration tests against ClickHouse 21.1.9.41
        run: >
          mvn -B -pl clickhouse-native-jdbc verify
          -Dtest=NoSuchUnitTest -Dsurefire.failIfNoSpecifiedTests=false
          -DCLICKHOUSE_IMAGE=yandex/clickhouse-server:21.1.9.41
